<!doctype html>
<!-- SYNTHETIC: the shape of amazon.com/ap/signin (form name="signIn", #ap_email). -->
<html><head><title>Amazon Sign-In</title></head>
<body><div id="a-page"><div class="a-section a-spacing-medium a-text-center"><i class="a-icon a-logo"></i></div>
<form name="signIn" method="post" novalidate action="https://www.amazon.com/ap/signin" class="auth-validate-form">
<h1 class="a-spacing-small">Sign in</h1>
<label for="ap_email" class="a-form-label">Email or mobile phone number</label>
<input type="email" maxlength="128" id="ap_email" name="email" class="a-input-text">
<input type="submit" id="continue" class="a-button-input">
</form></div></body></html>
